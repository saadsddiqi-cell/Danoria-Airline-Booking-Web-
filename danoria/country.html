// Standalone Booking Redirect logic
// Database and E-Ticket integrations are preserved in localStorage


// ═══════════════════════════════════════
// RENDER COUNTRY PAGE
// ═══════════════════════════════════════
function init(){
  const params=new URLSearchParams(window.location.search);
  const key=params.get('c');
  const d=cpData[key];
  if(!d){ document.body.innerHTML='<div style="text-align:center;padding:4rem;"><h2>Country not found.</h2><a href="index.html">Go Back</a></div>'; return; }

  document.title=`Danoria — ${d.name}`;
  document.getElementById('cpHeroBg').style.backgroundImage=`url(${d.hero})`;
  document.getElementById('cpFlag').textContent=d.flag;
  document.getElementById('cpName2').textContent=d.name;
  document.getElementById('cpTagline').textContent=d.tagline;
  document.getElementById('cpStripPrice').textContent=d.price;

  // STATS
  document.getElementById('cpStats').innerHTML=Object.entries(d.stats).map(([k,v])=>`
    <div class="cp-stat"><span class="cp-stat-val">${v}</span><span class="cp-stat-lbl">${k}</span></div>`).join('');

  // BEAUTY TABS
  ['nature','ecosystem','architecture'].forEach(type=>{
    const data=d.beauty[type];
    document.getElementById(`${type}Desc`).textContent=data.desc;
    const prefix=type==='nature'?'natur':type==='ecosystem'?'eco':'arch';
    document.getElementById(`${prefix}Imgs`).innerHTML=data.imgs.map(img=>`
      <div class="cp-img-card">
        <img src="${img.url}" alt="${img.label}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600&q=80'"/>
        <div class="cp-img-label">${img.label}</div>
      </div>`).join('');
  });

  // ITINERARY
  document.getElementById('cpItinerary').innerHTML=d.itinerary.map(i=>`
    <div class="cp-itin-item">
      <div class="cp-itin-day"><span>Day</span><strong>${i.day}</strong></div>
      <div class="cp-itin-body"><h4>${i.title}</h4><p>${i.desc}</p></div>
    </div>`).join('');

  // HOTELS
  document.getElementById('cpHotels').innerHTML=d.hotels.map(h=>`
    <div class="cp-hotel-card">
      <div class="cp-hotel-name">${h.name}</div>
      <div class="cp-hotel-city"><i class="fas fa-map-marker-alt"></i>${h.city}</div>
      <div class="cp-hotel-rating">${h.rating}</div>
      <div class="cp-hotel-price">${h.price}</div>
    </div>`).join('');

  // EXPENSES
  document.getElementById('cpExpenseBody').innerHTML=d.expenses.map(e=>`
    <tr class="${e.total?'total-row':''}">
      <td><i class="fas ${e.icon}" style="color:#0ea5e9;margin-right:.5rem;"></i>${e.cat}</td>
      <td style="color:#64748b;font-size:.85rem;">${e.det}</td>
      <td><strong>${e.cost}</strong></td>
    </tr>`).join('');

  // TABS
  document.querySelectorAll('.cp-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.cp-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.cp-tab-content').forEach(c=>c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
    });
  });

  // BOOK BUTTON
  document.getElementById('cpBookBtnMain').addEventListener('click',()=>{
    const fc=d.flights[0].split(' ')[0];
    const savedUser = localStorage.getItem('danoria_current_user');
    if (!savedUser) {
      alert("Authentication required. Please log in on the home page first.");
      window.location.href = "index.html?triggerAuth=true";
      return;
    }
    const url = `booking.html?flight=${encodeURIComponent(fc)}&route=${encodeURIComponent(d.name + ' Round Trip')}&price=${encodeURIComponent(d.price)}`;
    window.location.href = url;
  });
}

document.addEventListener('DOMContentLoaded',init);
</script>
